id: org.gtk.Gtk3theme.Matcha-dark-azul
branch: "3.22"
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk


build-extension: true
separate-locales: false

modules:
    - name: Matcha-dark-azul
      buildsystem: simple
      build-commands:
        - mkdir -pm 755 /usr/share/runtime/share/themes/Matcha-dark-azul/gtk-3.0/assets
        - cp src/gtk/gtk-3.0/gtk-dark-azul.css /usr/share/runtime/share/themes/Matcha-dark-azul/gtk-3.0/gtk.css
        - cp src/gtk/gtk-3.0/gtk-dark-azul.css /usr/share/runtime/share/themes/Matcha-dark-azul/gtk-3.0/gtk-dark.css
        - cp -rf src/gtk/assets-azul/* /usr/share/runtime/share/themes/Matcha-dark-azul/gtk-3.0/assets/
        - cp src/gtk/thumbnail-dark-azul.png /usr/share/runtime/share/themes/Matcha-dark-azul/gtk-3.0/thumbnail.png
        - install -Dm644 ${FLATPAK_ID}.appdata.xml -t ${FLATPAK_DEST}/share/appdata/
      sources:
        - type: archive
          url: "https://github.com/vinceliuice/Matcha-gtk-theme/archive/2024-05-01.tar.gz"
          sha256: 945856e788cc04fc704c9ab7adb75a936a21a51d38c51c25629097da6af4021b
    - type: file
      path: org.gtk.Gtk3theme.Matcha-dark-azul.appdata.xml